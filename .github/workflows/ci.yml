name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # prebuild が PDF.js の補助データを public/ へ複製するため、
      # ビルドまで通すと配布物一式が揃うことも確認できる。
      - run: npm run build
