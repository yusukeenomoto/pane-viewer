name: CI

on:
  push:
    branches: [main]
  pull_request:

# 読み取りしか要らないので、GITHUB_TOKEN の権限を絞っておく。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # タグは付け替えられるので、コミットSHAで固定する。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # prebuild が PDF.js の補助データを public/ へ複製するため、
      # ビルドまで通すと配布物一式が揃うことも確認できる。
      - run: npm run build
